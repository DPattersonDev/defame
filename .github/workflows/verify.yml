name: Verify De-Fame
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: deno check supabase/functions/defame-api/index.ts supabase/functions/verification-webhook/index.ts
      - run: deno test supabase/functions/defame-api/ai_test.ts supabase/functions/defame-api/policy_test.ts
      - run: npm ci --prefix supabase/tests
      - run: npm test --prefix supabase/tests
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: defame-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
